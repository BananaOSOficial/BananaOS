<!DOCTYPE html>
<head>
  <title>BananaOS - a distro que é uma banana</title>
  <meta name="viewport" content="width:device-width, initial-scale=1.0">
<style>
  body {
    color: #000000;
    background-color: #FFFFFF;
  }
  #logo {
    display: flex;
    border: 2px solid #F5F5F5;
    box-shadow: 0 0 5px #F5F5F5;
    text-align: center;
  }
  #banana {
    color: #F7D117;
  }
  #Linux {
    color: #5b8def;
    text-shadow: 1px 1px blue,
      2px 2px blue,
      3px 3px blue;
  }
  p {
    font-weight: bold;
  }
  h2 {
    color: #F7D117;
  }
</style>
</head>
<body>
  <header>
    <div id="logo">
      <h1 id="banana">Banana</h1>
      <h1 id="Linux">Linux</h1>
    </div>
  </header>
  <main>
    <h2>Sobre</h2>
   <p>O Banana Linux é um sistema linux baseado no arch que traz tema personalizado e traz um novo comando o banana que instala aplicativos AUR.</p>
  <h2>Como utilizar o comando banana:</h2>
    <p>banana install nome-do-pacote</p>
    <p>banana remove nome-do-pacote</p>
  </main>
</body>
